---
- name: Router Configuration
  hosts: routers
  gather_facts: no

  tasks:

    - name: Set hostname from inventory
      cisco.ios.ios_config:
        lines:
          - "hostname {{ inventory_hostname }}"

    - name: Configure router interfaces from inventory
      cisco.ios.ios_config:
        parents:
          - "interface {{ item.name }}"
        lines:
          - "ip address {{ item.ipv4 }} {{ item.mask }}"
          - "ipv6 address {{ item.ipv6 }}"
          - "no shutdown"
      loop: "{{ hostvars[inventory_hostname].interfaces }}"

    - name: Enable RIP v2 on R1
      when: inventory_hostname == "R1"
      cisco.ios.ios_config:
        lines:
          - router rip
          - version 2
          - no auto-summary
          - network 192.168.1.0
          - network 10.0.0.0

    - name: Enable RIP v2 on R2
      when: inventory_hostname == "R2"
      cisco.ios.ios_config:
        lines:
          - router rip
          - version 2
          - no auto-summary
          - network 192.168.2.0
          - network 10.0.0.0

    - name: Configure IPv6 static route on R1
      when: inventory_hostname == "R1"
      cisco.ios.ios_config:
        lines:
          - ipv6 route 2001:DB8:20::/64 2001:DB8:1::2

    - name: Configure IPv6 static route on R2
      when: inventory_hostname == "R2"
      cisco.ios.ios_config:
        lines:
          - ipv6 route 2001:DB8:10::/64 2001:DB8:1::1

    - name: Configure MOTD banner
      cisco.ios.ios_config:
        lines:
          - banner motd ^UNAUTHORISED ACCESS ONLY^
